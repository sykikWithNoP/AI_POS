# Builds the NINDITO POS Mobile Android app (.apk) on GitHub's machines and saves it in installers/,
# next to the Windows and Mac installers. Run it by hand: Actions → "Android app" → Run workflow.
#
# Signing: if the repository has the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (create them with mobile/scripts/make-android-key.sh),
# the app is signed with your own key, and every later version installs over the previous one.
# Without them it is signed with a throw-away test key: it installs and runs, but a later build
# made with a different key cannot be installed over it (back up, uninstall, install, restore).
name: Android app

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Test the phone engine
        working-directory: mobile
        run: npm test
      - name: Build the app screens and engine
        working-directory: mobile
        run: npm run build && npx cap sync android
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: signed with a test key."
            echo "kind=test" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Save the APK in installers/
        env:
          KIND: ${{ steps.key.outputs.kind }}
        run: |
          VER=$(node -p "require('./mobile/package.json').version")
          NAME="NINDITOPOS-Mobile-$VER-Android.apk"
          git rm -q --ignore-unmatch installers/NINDITOPOS-Mobile-*-Android.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "installers/$NAME"
          SUM=$(sha256sum "installers/$NAME" | cut -d' ' -f1)
          echo "$SUM  $NAME ($KIND key)" > installers/android.sha256
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add "installers/$NAME" installers/android.sha256
          git commit -m "Android app $VER"
          git pull --rebase -q origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
