# Builds NINDITO POS Mobile for Android (.apk) and iPhone (.ipa) on GitHub's machines and publishes
# a GitHub Release tagged mobile-v<version>. Installed apps check these releases for updates.
#
# Publish a new version: raise "version" in mobile/package.json and push to main.
# Or run it by hand: Actions → "Mobile app" → Run workflow (tick "publish" to make a release).
#
# Android releases are signed with YOUR key from repository secrets (Settings → Secrets and variables →
# Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Create them once with mobile/scripts/make-android-key.sh. Without them a test build is made but no
# release is published (phones only accept updates signed with the same key).
name: Mobile app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (needs the Android signing secrets)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [mobile/package.json]

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: ver
        run: echo "version=$(node -p "require('./mobile/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Build the app screens and engine
        working-directory: mobile
        run: npm run build && npx cap sync android
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Android signing secrets: making a test build only (no release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/NINDITOPOS-Mobile-${{ steps.ver.outputs.version }}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/release/*.apk

  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Build the app screens and engine
        working-directory: mobile
        run: |
          npm run build
          [ -d ios ] || npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Build unsigned iPhone app
        working-directory: mobile/ios/App
        run: |
          VER=$(node -p "require('../../package.json').version")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName NINDITO POS" App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string NINDITO POS" App/Info.plist
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload ../../release
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "../../release/NINDITOPOS-Mobile-$VER-iPhone-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/release/*.ipa

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success' && needs.android.outputs.signed == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.android.outputs.version }}
        run: |
          TAG="mobile-v$VER"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::notice::$TAG already exists"; exit 0; fi
          {
            echo "NINDITO POS Mobile $VER — the full POS running inside your phone. Your data stays on the phone."
            echo
            echo "**Android:** download the .apk on the phone and open it (allow installing from your browser when asked). Installed apps find this update by themselves (Settings › Updates)."
            echo
            echo "**iPhone:** the .ipa is unsigned. Install it with a sideloading tool such as AltStore or Sideloadly using your own Apple ID."
            echo
            echo "Personal use only. Commercial use without the copyright holder's written approval is forbidden."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NINDITO POS Mobile $VER" --notes-file notes.md out/android/*.apk $(ls out/ios/*.ipa 2>/dev/null)
